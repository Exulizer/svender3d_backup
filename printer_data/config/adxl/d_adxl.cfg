# ====================================================================
#   ADXL345 BESCHLEUNIGUNGSSENSOR - X-ACHSE (Druckkopf)
# ====================================================================

[mcu adxl_x_mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66368254F837B2A-if00

[adxl345 adxl_x]
cs_pin: adxl_x_mcu:gpio9
spi_software_sclk_pin: adxl_x_mcu:gpio10
spi_software_mosi_pin: adxl_x_mcu:gpio11
spi_software_miso_pin: adxl_x_mcu:gpio12

# ====================================================================
#   ADXL345 BESCHLEUNIGUNGSSENSOR - (KUSBA RP2040)
# ====================================================================

[mcu kusba]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6623446536EBE2C-if00

[adxl345 adxl_y]
cs_pin: kusba:gpio1
spi_bus: spi0a

[resonance_tester]
accel_chip_x: adxl345 adxl_x
accel_chip_y: adxl345 adxl_y
probe_points:
    117.5, 117.5, 20

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
# Der Ordner wird automatisch erstellt und ist in Fluidd/Mainsail links im Menü sichtbar.
number_of_results_to_keep: 10
# Hält die SD-Karte sauber, indem alte Messungen (älter als die letzten 10) gelöscht werden.
keep_raw_data: False
# Spart Platz. Wir brauchen nur die Bilder (.png), nicht die Rohdaten (.stdata).
show_macros_in_webui: True
# WICHTIG: Damit erscheinen die Knöpfe für die Messungen direkt in deiner Makro-Liste.
timeout: 600
# 10 Minuten Puffer für die Berechnung der Grafiken auf dem Pi.
measurements_chunk_size: 2
# Sicherer Wert für den Pi, um "Timer Too Close" Fehler während der Messung zu vermeiden.
max_freq: 200
# Reicht völlig aus, da dein Drucker seine Resonanzen (59Hz/46Hz) weit unter diesem Wert hat.
dpi: 300
# Sorgt für knackscharfe Bilder der Frequenzkurven.