#################################################
# HOTEND-LÜFTER (HEATBREAK COOLING)
#################################################
[heater_fan heatbreak_cooling_fan]
pin: PC7
max_power: 1.0
kick_start_time: 0.5
off_below: 0.0
cycle_time: 0.01

#################################################
# STEUERUNGS- / GEHÄUSELÜFTER (CONTROLLER FAN)
#################################################
[heater_fan controller_fan]
pin: PB15
heater: extruder
heater_temp: 50
fan_speed: 1
kick_start_time: 0.5
    
#################################################
# BAUTEILKÜHLUNG (PART COOLING FAN)
#################################################
[fan]
pin: PC6
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10
cycle_time: 0.01

#################################################
# HOST-KÜHLUNG (RASPBERRY PI TEMP FAN)
#################################################
[temperature_fan rpi_fan]
pin: Pi_Fan:gpio18
max_power: 0.7              # Begrenzt auf 70%, um Lärmspitzen zu vermeiden
shutdown_speed: 0.0
kick_start_time: 0.5
sensor_type: temperature_host
min_temp: 0
max_temp: 100
target_temp: 45.0           # Zieltemperatur
control: pid
# --- Optimierte PID Werte ---
pid_Kp: 2.0                 # Etwas höher als dein Wert, um stabil auf 50°C zu bleiben
pid_Ki: 0.2                 # Kleinerer I-Anteil verhindert das "Überschießen" der Drehzahl
pid_Kd: 1.0                 # Dämpft die Reaktion bei schnellen Lastwechseln
# ----------------------------
min_speed: 0.3              # 30% Grundrauschen (verhindert das Stoppen)
off_below: 0.2              # Schaltet erst unter 20% ganz ab, falls nötig
