[virtual_sdcard]
path: /home/exulizer/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#################################################
# INCLUDES (Einbindungen)
#################################################
[exclude_object]
[include mainsail.cfg]
[include shell_command.cfg]
#[include motor_konstanten.cfg]
[include ./probe/a_*.cfg]
[include ./fan/a_*cfg]
[include ./adxl/a_*.cfg]
[include ./bed_mesh/a_*.cfg]
[include ./bed_screws_leveling/a_*.cfg]
[include ./std_macros/a_*.cfg]
#[include ./retract/a_*.cfg]
[include ./start_end/start_end.cfg]
[include backupklipper.cfg]
[include timelapse.cfg]

#################################################
# GRUNDKONFIGURATION & MCUs
#################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_150032000A504B5735313920-if00

[mcu Pi_Fan]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 300 #500 
max_accel: 2000 #4000
max_z_velocity: 15
max_z_accel: 100 
minimum_cruise_ratio: 0.5
square_corner_velocity: 6.6

[gcode_arcs]
resolution: 0.05


#################################################
# ACHSEN (STEPPER) & TREIBER
#################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14 
microsteps: 32 #16 teste auch 64
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
interpolate: false #true
uart_address: 0
run_current: 0.7 #0.580
stealthchop_threshold: 60

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 32 #16 teste auch 64
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
interpolate: false #true
uart_address: 2
run_current: 0.7 #0.580
stealthchop_threshold: 60

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32 #16 teste auch 64
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5           # Geschwindigkeit beim ersten Anfahren (in mm/s)
second_homing_speed: 2    # Langsamere Geschwindigkeit für Präzision
homing_retract_dist: 3.0  # Weg, den die Achse zwischen den Messungen hochfährt

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.650           # Das ist ein guter, kräftiger Wert für den Ender 3
interpolate: true            # <--- Wieder aktivieren für Laufruhe
stealthchop_threshold: 0     # <--- Absolut richtig! Lass das auf 0 (SpreadCycle)

#[force_move]
#enable_force_move: True


#################################################
# EXTRUDER
#################################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.549
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
pressure_advance_smooth_time: 0.020
min_temp: 0
max_temp: 265
max_extrude_cross_section: 5
max_extrude_only_distance: 101.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.700
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 200
#The maximum "cumulative temperature error" before raising an
#error. Smaller values result in stricter checking and larger
#values allow for more time before an error is reported.
#Specifically, the temperature is inspected once a second and if it
#is close to the target temperature then an internal "error
#counter" is reset; otherwise, if the temperature is below the
#target range then the counter is increased by the amount the
#reported temperature differs from that range. Should the counter
#exceed this "max_error" then an error is raised. The default is
#120.
check_gain_time: 120
#This controls heater verification during initial heating. Smaller
#values result in stricter checking and larger values allow for
#more time before an error is reported. Specifically, during
#initial heating, as long as the heater increases in temperature
#within this time frame (specified in seconds) then the internal
#"error counter" is reset. The default is 20 seconds for extruders
#and 60 seconds for heater_bed.
hysteresis: 5
#The maximum temperature difference (in Celsius) to a target
#temperature that is considered in range of the target. This
#controls the max_error range check. It is rare to customize this
#value. The default is 5.
heating_gain: 1
#The minimum temperature (in Celsius) that the heater must increase
#by during the check_gain_time check. It is rare to customize this
#value. The default is

#################################################
# HEIZBETT
#################################################

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 110

#################################################
# SONDEN & LEVELING
#################################################

[bltouch]
# --- Hardware & Verbindung ---
sensor_pin: ^PC14
control_pin: PA1
pin_move_time: 0.680
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False      # Nadel bleibt draußen (Speed-Modus)
# --- Offsets & Abstände ---
x_offset: -31.4
y_offset: -40.1
# z_offset: 1.460               # Dein ermittelter Wert (Beispiel)
sample_retract_dist: 5.0        # Genug Platz für die Nadel zum Reagieren
# --- Geschwindigkeiten ---
speed: 10                       # Abtastgeschwindigkeit
lift_speed: 20                  # Geschwindigkeit beim Hochfahren zwischen Messungen
# --- Messgenauigkeit & Toleranz ---
samples: 2
samples_result: median
samples_tolerance: 0.08         # Stabilisiert das System bei Direct-Drive Vibrationen
samples_tolerance_retries: 3
  
[safe_z_home]
home_xy_position: 148.9, 157.6  # OPTIMIERT: Sensor exakt in der Bettmitte
speed: 100.0                    # Erhöht: Schnellere Fahrt zur Mitte
z_hop: 15.0                     # Erhöht: Mehr Sicherheit für die Nadel beim Homing
z_hop_speed: 15.0               # Erhöht: Z-Achse fährt schneller hoch/runter
move_to_previous: False         # Bleibt nach dem Homing oben (Sicherheit)

[bed_mesh]
speed: 250
horizontal_move_z: 10
mesh_min: 10,10
mesh_max: 190,180
probe_count: 6,6
mesh_pps: 6,6
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 117.5, 117.5

[screws_tilt_adjust]
screw1: 61.4, 70.1
screw1_name: vorne_links_anker
screw2: 220.0, 70.1      # X auf 220, um bei hoher Speed nicht anzuschlagen
screw2_name: vorne_rechts
screw3: 220.0, 230.0
screw3_name: hinten_rechts
screw4: 61.4, 230.0
screw4_name: hinten_links
speed: 250                # Maximale Reisegeschwindigkeit
horizontal_move_z: 10      # Nur 5mm hochfahren (Stift bleibt knapp überm Bett)
screw_thread: CW-M4

[respond] # Erlaubt Textausgaben in der Konsole

[gcode_macro LEVEL_BED_HOT]
description: Heizen, 5 Min warten mit Info, dann Messen
gcode:
    RESPOND MSG="Bett-Leveling: Heize auf 60 Grad..."
    M140 S60
    G28
    G1 X10 Y210 Z50 F3000
    M190 S60
    
    RESPOND MSG="Temperatur erreicht. Warte 5 Min für Heat Soak..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 4 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 3 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 2 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Letzte Minute läuft..."
    G4 P60000 
    
    RESPOND MSG="Heat Soak beendet. Starte Messung..."
    G28
    SCREWS_TILT_CALCULATE

#################################################
# ZUSÄTZLICHE SENSOREN
#################################################

[temperature_sensor SKR 3]
sensor_type: temperature_mcu

[temperature_sensor PI]
sensor_type: temperature_host

#################################################
# AUTOTUNE
#################################################
[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: performance

[autotune_tmc stepper_y]
motor: creality-42-34
tuning_goal: performance

[autotune_tmc stepper_z]
motor: creality-42-40  # Falls du den größeren 42-40 hast: creality-42-40
tuning_goal: silent

[autotune_tmc extruder]
motor: creality-42-34
tuning_goal: performance

