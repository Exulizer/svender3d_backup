[virtual_sdcard]
path: /home/exulizer/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#################################################
# INCLUDES (Einbindungen)
#################################################
[exclude_object]
[include mainsail.cfg]
[include shell_command.cfg]
[include ./probe/a_*.cfg]
[include ./fan/a_*cfg]
[include ./adxl/a_*.cfg]
[include ./bed_mesh/a_*.cfg]
[include ./bed_screws_leveling/a_*.cfg]
[include ./std_macros/a_*.cfg]
[include ./start_end/start_end.cfg]
#[include ./ztilt/a_*.cfg]
[include backupklipper.cfg]
[include timelapse.cfg]

#################################################
# GRUNDKONFIGURATION & MCUs
#################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_150032000A504B5735313920-if00

[mcu Pi_Fan]
serial: /tmp/klipper_host_mcu

[mcu ebb36]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_240054000E504D4D37393820-if00 # Nutze die exakte Klipper-ID von oben!

[printer]
kinematics: cartesian
max_velocity: 300 #500 
max_accel: 3500 #4000
max_z_velocity: 15
max_z_accel: 150 
minimum_cruise_ratio: 0.5
square_corner_velocity: 6.6

[gcode_arcs]
resolution: 0.05


#################################################
# ACHSEN (STEPPER) & TREIBER
#################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14 
microsteps: 16 #teste auch 64
rotation_distance: 39.88
endstop_pin: ^PC0
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
interpolate: true
uart_address: 0
run_current: 0.7 #0.580
stealthchop_threshold: 60

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16 #16 teste auch 64
rotation_distance: 39.84
endstop_pin: ^PC1
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
interpolate: true
uart_address: 2
run_current: 0.7 #0.580
stealthchop_threshold: 60

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 32 #16 teste auch 64
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5           # Geschwindigkeit beim ersten Anfahren (in mm/s)
second_homing_speed: 2    # Langsamere Geschwindigkeit für Präzision
homing_retract_dist: 3.0  # Weg, den die Achse zwischen den Messungen hochfährt

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.8           # Das ist ein guter, kräftiger Wert für den Ender 3
interpolate: true            # <--- Wieder aktivieren für Laufruhe
stealthchop_threshold: 0     # <--- Absolut richtig! Lass das auf 0 (SpreadCycle)



[manual_stepper z1]
step_pin: ebb36:PD0
dir_pin: ebb36:PD1
enable_pin: !ebb36:PD2
microsteps: 16
rotation_distance: 8

[tmc2209 manual_stepper z1]
uart_pin: ebb36:PA15
run_current: 0.600
stealthchop_threshold: 999999

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z10 F600           ; Sicherheit: Erstmal 10mm hochfahren
    G28 X Y               ; X und Y homen
    G0 X117.5 Y117.5 F3600 ; Zur Bettmitte fahren (Ender 3 V2)
    
    # Jetzt beide Motoren synchron nach UNTEN bewegen
    MANUAL_STEPPER STEPPER=z1 ENABLE=1
    MANUAL_STEPPER STEPPER=z1 SET_POSITION=10
    MANUAL_STEPPER STEPPER=z1 MOVE=-20 SPEED=5 SYNC=0 ; MOVE=-20 fährt nach UNTEN
    
    G28 Z                 ; Die linke Spindel sucht jetzt auch das Bett
    
    # Sobald der BLTouch am EBB36 triggert, stoppen beide.
    MANUAL_STEPPER STEPPER=z1 STOP
    G0 Z10 F600           ; Nach dem Homing wieder sicher anheben


#[force_move]
#enable_force_move: True


#################################################
# EXTRUDER
#################################################

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.549
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
pressure_advance_smooth_time: 0.020
min_temp: 0
max_temp: 265
min_extrude_temp: 170
max_extrude_cross_section: 5
max_extrude_only_distance: 101.0

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.700
sense_resistor: 0.110
interpolate: False
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 150         # Guter Mittelwert zwischen Sicherheit und Fehlalarm-Schutz
check_gain_time: 40    # Reicht völlig aus für das kleine Ender-Hotend
hysteresis: 5          # Standard belassen
heating_gain: 2        # Mindestens 2 Grad Anstieg in 40 Sek.

#################################################
# HEIZBETT
#################################################

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 110

#################################################
# SONDEN & LEVELING
#################################################

[bltouch]
sensor_pin: ^ebb36:PB8
control_pin: ebb36:PB9
#sensor_pin: ^PC14
#control_pin: PA1
pin_move_time: 0.680
probe_with_touch_mode: True
pin_up_touch_mode_reports_triggered: False
stow_on_each_sample: False      

# --- Offsets & Abstände ---
x_offset: -31.4
y_offset: -40.1
# z_offset: 1.460               

# --- Optimierung für Direct Drive ---
sample_retract_dist: 2.0        # Kleinerer Weg reduziert Schwingungen beim Hochfahren
speed: 3                        # DEUTLICH langsamer für höhere Präzision (Direct Drive Trägheit)
lift_speed: 10                  # Ruhigeres Anfahren der nächsten Position

# --- Messgenauigkeit ---
samples: 3                      # 3 Messungen sind bei schwerem Kopf statistisch sicherer
samples_result: median
samples_tolerance: 0.01         # Viel strenger! 0.08 war fast ein halber Layer.
samples_tolerance_retries: 5    # Erlaubt dem System, sich bei Vibrationen zu fangen
  
#[safe_z_home]
#home_xy_position: 148.9, 157.6  # OPTIMIERT: Sensor exakt in der Bettmitte
#speed: 100.0                    # Erhöht: Schnellere Fahrt zur Mitte
#z_hop: 15.0                     # Erhöht: Mehr Sicherheit für die Nadel beim Homing
#z_hop_speed: 15.0               # Erhöht: Z-Achse fährt schneller hoch/runter
#move_to_previous: False         # Bleibt nach dem Homing oben (Sicherheit)

[bed_mesh]
speed: 250
horizontal_move_z: 10
mesh_min: 10,10
mesh_max: 190,180
probe_count: 6,6
mesh_pps: 6,6
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 117.5, 117.5

[screws_tilt_adjust]
screw1: 61.4, 70.1
screw1_name: vorne_links_anker
screw2: 220.0, 70.1      # X auf 220, um bei hoher Speed nicht anzuschlagen
screw2_name: vorne_rechts
screw3: 220.0, 230.0
screw3_name: hinten_rechts
screw4: 61.4, 230.0
screw4_name: hinten_links
speed: 250                # Maximale Reisegeschwindigkeit
horizontal_move_z: 10      # Nur 5mm hochfahren (Stift bleibt knapp überm Bett)
screw_thread: CW-M4

[respond] # Erlaubt Textausgaben in der Konsole


#################################################
# ZUSÄTZLICHE SENSOREN
#################################################

[temperature_sensor SKR 3]
sensor_type: temperature_mcu

[temperature_sensor PI]
sensor_type: temperature_host

#################################################
# AUTOTUNE
#################################################
[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: performance

[autotune_tmc stepper_y]
motor: creality-42-34
tuning_goal: performance

[autotune_tmc stepper_z]
motor: creality-42-40  # Falls du den größeren 42-40 hast: creality-42-40
tuning_goal: silent

[autotune_tmc extruder]
motor: creality-42-34
tuning_goal: performance


[skew_correction]


