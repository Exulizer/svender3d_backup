[respond]
[include mcu_updater.cfg]

[virtual_sdcard]
path: /home/exulizer/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

#################################################
# INCLUDES (Einbindungen)
#################################################
[exclude_object]
[include mainsail.cfg]
[include shell_command.cfg]
[include ./probe/a_*.cfg]
[include ./fan/a_*cfg]
[include ./adxl/a_*.cfg]
[include ./bed_mesh/a_*.cfg]
[include ./bed_screws_leveling/a_*.cfg]
[include ./std_macros/a_*.cfg]
[include ./start_end/start_end.cfg]
[include ./ztilt/a_*.cfg]
[include backupklipper.cfg]
[include timelapse.cfg]

#################################################
# GRUNDKONFIGURATION & MCUs
#################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_150032000A504B5735313920-if00

[mcu Pi_Fan]
serial: /tmp/klipper_host_mcu

[mcu ebb36]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_240054000E504D4D37393820-if00 # Nutze die exakte Klipper-ID von oben!

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 4500
max_z_velocity: 15
max_z_accel: 150 
minimum_cruise_ratio: 0.5
square_corner_velocity: 6.8

[gcode_arcs]
resolution: 0.05

[force_move]
enable_force_move: True

#################################################
# ACHSEN (STEPPER) & TREIBER
#################################################

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14 
microsteps: 64 #teste auch 64
rotation_distance: 39.88
endstop_pin: ^PC0
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
interpolate: true
uart_address: 0
run_current: 0.7 #0.580
stealthchop_threshold: 0 #60

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 64 #16 teste auch 64
rotation_distance: 39.84
endstop_pin: ^PC1
position_endstop: 0
position_max: 230
homing_speed: 50
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
interpolate: true
uart_address: 2
run_current: 0.7 #0.580
stealthchop_threshold: 0 #60

#################################################
# ACHSEN (STEPPER) & TREIBER
#################################################

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16 
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.65 #0.8
interpolate: true
stealthchop_threshold: 0

[stepper_z1]
step_pin: PB3
dir_pin: PB4       # Falls er falsch herum dreht: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC11
tx_pin: PC10
uart_address: 3    # Eindeutige Adresse am SKR-Bus
run_current: 0.65 #0.8
interpolate: true
stealthchop_threshold: 0

#################################################
# EXTRUDER (Jetzt am EBB36)
#################################################

[extruder]
# MOTOR-PINS (EBB36)
step_pin: ebb36:PD0
dir_pin: !ebb36:PD1 
enable_pin: !ebb36:PD2
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
microsteps: 16
rotation_distance: 7.549
nozzle_diameter: 0.400
filament_diameter: 1.750
#pressure_advance: 0.026 # Dein PLA-Wert
pressure_advance_smooth_time: 0.020
min_temp: 0
max_temp: 265
min_extrude_temp: 170
max_extrude_cross_section: 5
max_extrude_only_distance: 101.0

[tmc2209 extruder]
uart_pin: ebb36:PA15
run_current: 0.750      # Ein guter Wert für den 42-34 am Direct-Drive
interpolate: False      # Behalten wir so bei (besser für CAN-Bus)
stealthchop_threshold: 0

[verify_heater extruder]
max_error: 150         # Guter Mittelwert zwischen Sicherheit und Fehlalarm-Schutz
check_gain_time: 40    # Reicht völlig aus für das kleine Ender-Hotend
hysteresis: 5          # Standard belassen
heating_gain: 2        # Mindestens 2 Grad Anstieg in 40 Sek.

#################################################
# HEIZBETT
#################################################

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
min_temp: 0
max_temp: 110

#################################################
# SONDEN & LEVELING
#################################################

[bltouch]
sensor_pin: ^PC14   # Der ^ sorgt für ein sauberes Signal am SKR
control_pin: PA1
pin_move_time: 0.680
probe_with_touch_mode: True
stow_on_each_sample: False  
pin_up_reports_not_triggered: True
pin_up_touch_mode_reports_triggered: True
x_offset: -31.4
y_offset: -40.1
# z_offset: 1.460  
sample_retract_dist: 2.0        # Kleinerer Weg reduziert Schwingungen beim Hochfahren
speed: 3                        # DEUTLICH langsamer für höhere Präzision (Direct Drive Trägheit)
lift_speed: 10                  # Ruhigeres Anfahren der nächsten Position
samples: 3                      # 3 Messungen sind bei schwerem Kopf statistisch sicherer
samples_result: median
samples_tolerance: 0.02         # Viel strenger! 0.08 war fast ein halber Layer.
samples_tolerance_retries: 5    # Erlaubt dem System, sich bei Vibrationen zu fangen
  
[safe_z_home]
home_xy_position: 117.5, 117.5 # Die Mitte deines Ender 3 V2 Betts
speed: 100
z_hop: 10                      # Fährt Z erst 10mm hoch zur Sicherheit
z_hop_speed: 5

[bed_mesh]
speed: 250
horizontal_move_z: 5            # Schnellerer Wechsel zwischen den Punkten
mesh_min: 10,10
mesh_max: 190,180
probe_count: 7,7                # Ungerade! Misst den echten Mittelpunkt und erfasst die Wölbung besser
mesh_pps: 2,2                   # Verhindert mathematisches Überschwingen an den Rändern
algorithm: bicubic
bicubic_tension: 0.2
zero_reference_position: 117.5, 117.5

[screws_tilt_adjust]
screw1: 61.4, 70.1
screw1_name: vorne_links_anker
screw2: 220.0, 70.1      # X auf 220, um bei hoher Speed nicht anzuschlagen
screw2_name: vorne_rechts
screw3: 220.0, 230.0
screw3_name: hinten_rechts
screw4: 61.4, 230.0
screw4_name: hinten_links
speed: 250                # Maximale Reisegeschwindigkeit
horizontal_move_z: 10      # Nur 5mm hochfahren (Stift bleibt knapp überm Bett)
screw_thread: CW-M4

[respond] # Erlaubt Textausgaben in der Konsole


#################################################
# ZUSÄTZLICHE SENSOREN
#################################################

[temperature_sensor SKR 3]
sensor_type: temperature_mcu

[temperature_sensor PI]
sensor_type: temperature_host

[temperature_sensor EBB36]
sensor_type: temperature_mcu
sensor_mcu: ebb36 # Hier den Namen deiner EBB-MCU eintragen

#################################################
# AUTOTUNE
#################################################

[autotune_tmc stepper_x]
motor: creality-42-34
tuning_goal: performance
extra_hysteresis: 2
pwm_freq_target: 35000  # Wert in Hz (24000 Hz = 24 kHz)

[autotune_tmc stepper_y]
motor: creality-42-34
tuning_goal: performance
extra_hysteresis: 2
pwm_freq_target: 35000

[autotune_tmc stepper_z]
motor: creality-42-40  # Falls du den größeren 42-40 hast: creality-42-40
tuning_goal: silent

[autotune_tmc stepper_z1]
motor: creality-42-40  # Falls du den größeren 42-40 hast: creality-42-40
tuning_goal: silent

[autotune_tmc extruder]
motor: creality-42-34
tuning_goal: silent
extra_hysteresis: 1      # Sorgt für einen gleichmäßigeren Druckaufbau
pwm_freq_target: 24000

[skew_correction]


