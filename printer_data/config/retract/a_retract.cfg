[firmware_retraction]
retract_length: 0.75      # Minimal erhöht (innerhalb deiner 0.4-0.8 Zone)
retract_speed: 35         # Etwas langsamer: Zieht den geschmolzenen Faden sauberer zurück
unretract_speed: 35       # Synchroner Speed für gleichmäßigen Druckaufbau
unretract_extra_length: 0 # Bleib bei 0, solange du keine Lücken am Nahtpunkt hast

