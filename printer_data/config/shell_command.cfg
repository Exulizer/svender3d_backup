[gcode_shell_command backup_to_github]
command: /home/exulizer/klipper-backup/script.sh
timeout: 30.0
verbose: True

[gcode_macro BACKUP_CFG]
description: Sichert die Konfiguration auf GitHub und gibt Status aus
gcode:
