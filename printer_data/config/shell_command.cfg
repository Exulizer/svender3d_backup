    RESPOND MSG="GitHub-Backup: Starte Upload..."
    RUN_SHELL_COMMAND CMD=backup_to_github
    RESPOND MSG="GitHub-Backup: Vorgang abgeschlossen!"
    M117 Backup fertig! 