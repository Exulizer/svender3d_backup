[gcode_macro START_PRINT]
gcode:
    UPDATE_DELAYED_GCODE ID=cooldown_motor_off DURATION=0 ; Timer stoppen
    
    # 0. Parameter einlesen
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(205)|float %}
    {% set AREA_START = params.AREA_START|default("0,0") %}
    {% set AREA_END = params.AREA_END|default("0,0") %}

    _SET_TIMELAPSE_SETUP
    
    # 1. Bett aufheizen & Düse auf sichere 140°C Standby bringen
    M117 Warming up...
    M140 S{BED_TEMP}                ; Bett-Heizung starten
    M104 S140                       ; Düse auf 140°C Standby (verhindert Verkohlen)
    M190 S{BED_TEMP}                ; Warten bis Bett VOLL aufgeheizt ist
    
    # 2. Homing & Z-Tilt (Düse ist stabil bei 140°C)
    M117 Homing...
    G28 
    
    M117 Z-Tilt Adjust...
    Z_TILT_ADJUST                   ; Die 8 Durchläufe passieren jetzt sicher bei 140°C
    
    M117 Re-Homing Z...
    G28 Z                           ; Z-Nullpunkt nach Ausrichtung neu setzen
    
    # 3. Meshing (Immer noch bei 140°C)
    M117 Meshing...
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE AREA_START={AREA_START} AREA_END={AREA_END}
    
    # --- SKEW CORRECTION ---
    SET_SKEW XY=69.93,70.03,49.85
    
    # 4. Parken & Finales Aufheizen
    G90                       
    G1 X2 Y10 Z10 F5000             ; Parkposition am Rand (X2 Y10)
    
    M117 Final Heating...
    M109 S{EXTRUDER_TEMP}           ; Erst jetzt auf volle Zieltemperatur gehen
    
    # 5. NEU: Wipe & Retract (Verhindert das Mitschleifen von Fäden)
    G92 E0                          ; Extruder nullen
    G1 E-2.0 F2400                  ; 2mm Retract (stoppt das Tropfen/Oozing)
    G1 Z0.25 F300                   ; Düse flach aufs Bett absenken
    G1 X10 F3000                    ; Abstreifen: Fahre flach über das Bett nach X10
                                    ; Dies lässt den Oozing-Faden am Bettrand liegen.
    
    # 6. Reinigung & Startlinie
    PRIME_LINE
    
    # 7. Druckstart
    M117 Printing...

[gcode_macro _SAFE_BED_CALIBRATE]
description: Führt BED_MESH_CALIBRATE nur aus, wenn es von START_PRINT benoetigt wird
gcode:
    {% if printer["gcode_macro START_PRINT"].leveling_needed == 1 %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        # Wenn der Drucker bereits druckt, ignorieren wir den Befehl
        M117 Skipping Calibration...
    {% endif %}
    

[gcode_macro PRIME_LINE]
description: Massive Reinigung durch hohen Druckaufbau und breite Spur
gcode:
    G90                                 ; Absolute Koordinaten
    # (Wir starten bei X10 Y10, da der Wipe aus START_PRINT uns dorthin gebracht hat)
    G1 Z0.25 F240                       ; Tiefe für maximale Breite
    G92 E0.0                            ; Extruder zurücksetzen
    
    # 1. Druckaufbau (Squeeze)
    M117 Super Squeeze...
    G1 E5.0 F200                        ; 5mm Filament im Stand vorpressen
    G4 P1000                            ; 1 Sekunde warten, damit der Druck steht
    
    # 2. Massive Prime Line (50mm Länge)
    M117 Massive Purge...
    G1 X60 Y10 E22.0 F800.0             ; Kraftvolle Fahrt bis X60 (E22 ist sehr dick!)
    
    G92 E0.0                            ; Extruder zurücksetzen
    G1 Z3.0 F3000                       ; Schnelles Abheben nach oben
    G1 X75 F5000                        ; 15mm Ruck zur Seite (Saubere Abrisskante)
    G1 Z1.0 F5000.0                     ; Z-Höhe für den tatsächlichen Druckstart

[gcode_macro END_PRINT]
gcode:
    # 1. ZUERST wegfahren
    G91                             ; Relative Positionierung
    G1 E-2 F2700                    ; Retract
    G1 Z10 F3000                    ; Hebt die Z-Achse um 10mm an
    G90                             ; Absolute Positionierung
    G1 X10 Y210 F5000               ; Deine Parkposition
    SET_SKEW CLEAR=1                
    
    # 2. Heizungen aus & Bauteillüfter AN zum schnellen Abkühlen
    M140 S0                         ; Bett ausschalten
    M104 S0                         ; Extruder ausschalten
    M106 S255                       ; Bauteillüfter auf 100%
    
    # 3. Statusmeldung & Video
    M117 Video & Abkuehlen...
    RESPOND MSG="Druck beendet. Starte Video-Rendering und Abkühlphase."
    TIMELAPSE_RENDER

    # 4. Warten bis Hotend unter 50°C ist
    # Das Makro pausiert hier so lange, bis die 50 Grad erreicht sind.
    M109 R50                        

    # 5. ALLES AUS (JETZT gehen Bauteillüfter und Motoren aus)
    M107                            ; Bauteillüfter AUS
    M84                             ; Motoren AUS
    M117 Standby
    

######################################################################
# Beeper
######################################################################

# M300 : Play tone. Beeper support, as commonly found on usual LCD
# displays (i.e. RepRapDiscount 2004 Smart Controller, RepRapDiscount
# 12864 Full Graphic). This defines a custom I/O pin and a custom
# GCODE macro.  Usage:
#   M300 [P<ms>] [S<Hz>]
#   P is the tone duration, S the tone frequency.
# The frequency won't be pitch perfect.

##[output_pin BEEPER_pin]
##pin: EXP1_1
#   Beeper pin. This parameter must be provided.
#   ar37 is the default RAMPS/MKS pin.
##pwm: True
#   A piezo beeper needs a PWM signal, a DC buzzer doesn't.
##value: 0
#   Silent at power on, set to 1 if active low.
##shutdown_value: 0
#   Disable at emergency shutdown (no PWM would be available anyway).
##cycle_time: 0.001
#   Default PWM frequency : 0.001 = 1ms will give a tone of 1kHz
#   Although not pitch perfect.

[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    SET_PIN PIN=BEEPER_pin VALUE=0.5 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0


######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state
