[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

 
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameter
    {% set z = params.Z|default(10)|int %}                                     ; Z-Hop Höhe
    {% set e = 0.8 %}                                                          ; Dein Retract-Wert für Direct-Drive

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                ; Z-Hop für Resume speichern
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target} ; Temperatur speichern

        SAVE_GCODE_STATE NAME=PAUSE                                            ; Aktuelle Position speichern
        BASE_PAUSE                                                             ; Druck pausieren
        
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}
            G91                                                                ; Relative Positionierung
            G1 E-{e} F2100                                                     ; Kurzer Retract (0.8mm)
            G1 Z{z} F900                                                       ; Z anheben
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}

        G90                                                                    ; Absolute Positionierung
        G1 X10 Y210 F6000                                                      ; Parken auf deiner X10 Y210 Position
        
        SAVE_GCODE_STATE NAME=PAUSEPARK                                        ; Parkposition speichern
        SET_IDLE_TIMEOUT TIMEOUT=3600                                          ; Timeout auf 1 Stunde (3600s) reduziert
        M104 S0                                                                ; Hotend ausschalten (Strom sparen)
    {% endif %}



[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        #SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                          ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}



[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  ## Move head and retract only if not already in the pause state and park set to true
  {% if printer.pause_resume.is_paused|lower == 'false' and park|lower == 'true'%}
    _TOOLHEAD_PARK_PAUSE_CANCEL
  {% endif %}
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE


[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Helper: Quick wipe and clean lift
variable_extrude: 1.0
gcode:
    ##### Parameter #####
    {% set safe_x = 10.0 %}
    {% set safe_y = 210.0 %}
    {% set z_lift = 8.0 %}       ; Kompromiss aus Hitzeschutz und Präzision
    {% set retract = 0.8 %}      ; Standard für deinen Direct-Drive
    {% set prime_extra = 0.04 %} ; Ein Hauch mehr, falls die Ecke "leer" wirkt

    # 1. DER REINIGUNGS-WIPE (Horizontaler Ruck)
    # Fährt 4mm schnell hin und her, um die Düse am Infill/Innenwand abzustreifen
    G91
    G1 X4 Y4 F9000               
    G1 X-2 Y-2 F9000
    
    # 2. RETRACT & SCHNELLER LIFT
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{retract} F3600       
    {% endif %}
    G1 Z{z_lift} F6000           ; Zügig hoch, um Hitze wegzubringen
    
    # 3. PARKFAHRT
    G90
    G1 X{safe_x} Y{safe_y} F8000 ; Schnelle, aber keine "brutale" Fahrt
    
    # 4. RÜCKKEHR
    G91
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E{retract + prime_extra} F2100
    {% endif %}
    G90

    M117 Wipe & Park

[gcode_macro OFF]
gcode:
    M84                                  ; turn steppers off
    TURN_OFF_HEATERS                     ; turn bed / hotend off
    M107                                 ; turn print cooling fan off
    #SET_FAN_SPEED FAN=Exhaust SPEED=0   ; turn exhaust fan off
    #SET_FAN_SPEED FAN=BedFans SPEED=0   ; bed fan off
    #SET_PIN PIN=caselight VALUE=0       ; turn case light off
[gcode_macro update_git]
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

#[gcode_shell_command update_git_script_message]
#command: bash -c "bash $HOME/klipper-backup/script.sh -c $0"
#timeout: 90.0
#verbose: True

[gcode_macro PROBE_CALIBRATE_START]
description: Startet den vereinfachten Z-Offset-Kalibrierungsprozess.
gcode:
    # 1. Homing aller Achsen
    G28
    
    # 2. Bewegt den Kopf sicher in die Mitte des Betts (Position muss angepasst werden!)
    # Verwenden Sie hier die tatsächlichen Mittenkoordinaten Ihres Betts (z.B. 117.5, 117.5 für Ender 3 V2)
    G0 X117.5 Y117.5 Z5 F6000 
    
    # 3. Startet den Klipper-Kalibrierungsmodus.
    PROBE_CALIBRATE
    
    # 4. Führt den ersten Probelauf durch, um den BLTouch-Auslösepunkt zu finden.
    PROBE_CALIBRATE_SINGLE_PROBE
    
[gcode_macro SHAKE_AND_TUNE]
description: Führt die Resonanzkalibrierung für alle Achsen aus
gcode:
    # 1. Startposition anfahren
    G28
    G90
    G0 Z20
    
    # 2. Kalibrierung starten
    SHAPER_CALIBRATE
    
    # 3. Konfiguration speichern und neu starten
    SAVE_CONFIG

[gcode_macro MESH_IT]
gcode:
    M117 Preprocessing for Adaptive Mesh...
    G4 P250
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1


[delayed_gcode cooldown_motor_off]
gcode:
    {% if printer.extruder.temperature > 50 %}
        # Wenn die Düse noch über 50°C ist, Timer in 30 Sek. erneut starten
        M117 Kühlen... ({printer.extruder.temperature|int}°C)
        UPDATE_DELAYED_GCODE ID=cooldown_motor_off DURATION=30
    {% else %}
        # Ziel erreicht: Alles aus
        M84                         ; Motoren deaktivieren
        M106 S0                     ; Bauteil-Lüfter aus
        M117 Fertig. Motoren aus.
        RESPOND MSG="Sicherheitstemperatur erreicht: Motoren und Lüfter wurden abgeschaltet."
    {% endif %}
    
[gcode_macro LEVEL_BED_HOT]
description: Heizen, 5 Min warten mit Info, dann Messen
gcode:
    RESPOND MSG="Bett-Leveling: Heize auf 60 Grad..."
    M140 S60
    G28
    G1 X10 Y210 Z50 F3000
    M190 S60
    
    RESPOND MSG="Temperatur erreicht. Warte 5 Min für Heat Soak..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 4 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 3 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Noch 2 Minuten..."
    G4 P60000 
    RESPOND MSG="Heat Soak: Letzte Minute läuft..."
    G4 P60000 
    
    RESPOND MSG="Heat Soak beendet. Starte Messung..."
    G28
    SCREWS_TILT_CALCULATE


[gcode_macro TEST_ZTILT_POSITIONS]
gcode:
    {% set speed = 5000 %} # Geschwindigkeit für die Fahrten
    
    M117 Starte Positionstest...
    G28                            # Erstmal Homing (Zwingend erforderlich!)
    
    # Fahre auf eine sichere Höhe, damit nichts kratzt
    G1 Z15 F600
    
    # --- Punkt 1: Links ---
    M117 Fahre zu Punkt 1 (Links)
    # Düse fährt auf X71.4 Y157.6, damit Sensor auf X40 Y117.5 steht
    G1 X71.4 Y157.6 F{speed}
    BLTOUCH_DEBUG COMMAND=pin_down  # Sensor kurz ausfahren (Test)
    G4 P1000                        # 1 Sekunde warten
    BLTOUCH_DEBUG COMMAND=pin_up    # Sensor wieder einfahren
    
    # --- Punkt 2: Rechts ---
    M117 Fahre zu Punkt 2 (Rechts)
    # Düse fährt auf X221.4 Y157.6, damit Sensor auf X190 Y117.5 steht
    G1 X221.4 Y157.6 F{speed}
    BLTOUCH_DEBUG COMMAND=pin_down
    G4 P1000
    BLTOUCH_DEBUG COMMAND=pin_up
    
    # --- Zurück zur Parkposition ---
    M117 Test abgeschlossen.
    G1 X10 Y210 Z15 F{speed}        # Deine Parkposition
    M117 Parkposition erreicht.